name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check deployment scripts without network access
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          timeout --kill-after=5s 120s node deploy/test-deploy-cloud.mjs

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -d dist/assets
