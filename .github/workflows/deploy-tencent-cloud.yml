name: Deploy to Tencent Cloud

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; do not upload or activate a release'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: tripeer-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor == 'cqz-cio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # Tooling uses trusted main; application source uses the selected CI SHA.
      - name: Check out deployment tooling
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false

      - name: Resolve latest successful main push CI
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'main',
              event: 'push', status: 'success', per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_branch !== 'main' || run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('No valid successful main push CI revision found');
            }
            core.setOutput('sha', run.head_sha);
            // Rebuilding the same CI must not reuse a stale release directory.
            const attempt = process.env.GITHUB_RUN_ATTEMPT;
            if (!/^[0-9]{1,6}$/.test(attempt)) throw new Error('Invalid deployment attempt');
            core.setOutput('release', `${run.head_sha}-${context.runId}${attempt.padStart(6, '0')}`);
            await core.summary.addHeading('Selected deployment version')
              .addLink(`CI #${run.run_number}`, run.html_url)
              .addRaw(`\n\nCommit: ${run.head_sha}\n\nManual trigger; no GitHub build artifact.\n`).write();

      - name: Check out successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: timeout --kill-after=10s 180s npm ci --no-audit --no-fund

      - name: Rebuild and verify selected CI revision
        working-directory: source
        env:
          RELEASE_ID: ${{ steps.source.outputs.release }}
        run: |
          timeout --kill-after=10s 180s npm run build
          test -s dist/index.html
          test -d dist/assets
          printf '%s\n' "$RELEASE_ID" > dist/deploy-version.txt
          du -sh dist

      - name: Configure verified SSH identity
        if: ${{ !inputs.dry_run }}
        env:
          PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$PRIVATE_KEY" || { echo 'Missing TENCENT_SSH_PRIVATE_KEY secret'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing TENCENT_SSH_KNOWN_HOSTS secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/tripeer-ssh"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/tripeer-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/tripeer-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/tripeer-ssh/key" > /dev/null
          ssh-keygen -F 124.220.2.69 -f "$RUNNER_TEMP/tripeer-ssh/known_hosts" > /dev/null

      - name: Incremental upload, activate and verify
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_ID: ${{ steps.source.outputs.release }}
          SSH_KEY: ${{ runner.temp }}/tripeer-ssh/key
          SSH_KNOWN_HOSTS: ${{ runner.temp }}/tripeer-ssh/known_hosts
        run: timeout --kill-after=15s 600s bash tooling/deploy/deploy-cloud.sh source/dist

      - name: Clean temporary build and SSH credentials
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/tripeer-ssh" "$GITHUB_WORKSPACE/source/dist"
